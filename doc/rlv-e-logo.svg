<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">RLV-E logo</title>
  <desc id="description">A red heart-shaped lock with gold trim and the letters RLV</desc>
  <defs>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e43f55"/>
      <stop offset="1" stop-color="#8d1028"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#dba72d"/>
      <stop offset="1" stop-color="#8b5410"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="116" fill="#0d1117" stroke="url(#gold)" stroke-width="8"/>

  <g filter="url(#shadow)">
    <path d="M128 219C102 198 57 164 43 126C30 91 47 58 79 54C101 51 117 64 128 80C139 64 155 51 177 54C209 58 226 91 213 126C199 164 154 198 128 219Z"
          fill="url(#heart)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M88 103V86C88 63 106 45 128 45C150 45 168 63 168 86V103"
          fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <path d="M96 104V87C96 68 110 55 128 55C146 55 160 68 160 87V104"
          fill="none" stroke="#19130b" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <text x="128" y="151" fill="#fff8e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="2" text-anchor="middle">RLV</text>
  <circle cx="128" cy="174" r="7" fill="#f7cc62"/>
  <path d="M128 179V193" stroke="#f7cc62" stroke-width="7" stroke-linecap="round"/>
</svg>
